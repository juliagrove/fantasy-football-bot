name: Trading Agent

on:
  # 3:13pm EST on Tue/Wed/Fri/Sat, restricted to the NFL season (Sep-Jan).
  schedule:
    - cron: "13 19 * 9-12,1 2,3,5,6"
  workflow_dispatch: {}

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  review-trades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAGUE_ID: ${{ vars.LEAGUE_ID }}
      BOT_TEAM_ID: ${{ vars.BOT_TEAM_ID }}
      SEASON: ${{ vars.SEASON }}
      TOPIC_ID: ${{ secrets.TOPIC_ID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      SWID: ${{ secrets.SWID }}
      PLATFORM_VERSION: ${{ vars.PLATFORM_VERSION }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
      BOT_NAME: ${{ vars.BOT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: player-agent/requirements.txt

      - run: pip install -r player-agent/requirements.txt

      - run: python trading-subagent/main.py
        working-directory: player-agent
