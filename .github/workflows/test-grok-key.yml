name: Test Grok API Key

on:
  workflow_dispatch: {}

jobs:
  test-key:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
    steps:
      - name: Check GROK_API_KEY against xai.com
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.x.ai/v1/models \
            -H "Authorization: Bearer $GROK_API_KEY")
          echo "HTTP status: $status"
          if [ "$status" -eq 200 ]; then
            echo "GROK_API_KEY is valid."
          else
            echo "GROK_API_KEY failed (status $status)."
            exit 1
          fi
